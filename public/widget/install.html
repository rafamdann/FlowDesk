<!doctype html>
<!--
  How to put FlowDesk on an iPhone home screen. Opened on the phone itself,
  so the script can be copied and pasted straight into Scriptable. The script
  is only a loader: the widget is /widget/flowdesk-widget.js, built from
  src/widget/flowdeskWidget.ts on every deploy.
-->
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="only light" />
  <title>FlowDesk widget</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    :root { --ink: #18170F; --muted: #6B6960; --bg: #F5F4EF; --card: #FFFFFF; --line: rgba(0,0,0,0.08); --green: #1A5C3A; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    ol { list-style: none; counter-reset: step; padding: 0; margin: 0; }
    li { counter-increment: step; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 16px 56px; margin-bottom: 12px; position: relative; }
    li::before { content: counter(step); position: absolute; left: 16px; top: 16px; width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    li b { display: block; margin-bottom: 2px; }
    li p { margin: 0; color: var(--muted); font-size: 15px; }
    h2 { font-size: 20px; margin: 36px 0 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .card > b { display: block; margin-bottom: 8px; }
    .card ol.sub { list-style: decimal; padding-left: 20px; margin: 0; }
    .card ol.sub li { counter-increment: none; background: none; border: 0; border-radius: 0; padding: 0; margin: 0 0 8px; color: var(--muted); font-size: 15px; }
    .card ol.sub li::before { content: none; }
    code { background: var(--bg); padding: 1px 6px; border-radius: 6px; color: var(--ink); font-size: 14px; }
    button { margin-top: 12px; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font: inherit; font-weight: 600; }
    button.done { background: #2F7A4F; }
    pre { margin: 12px 0 0; padding: 12px; background: var(--bg); border-radius: 10px; font-size: 11px; line-height: 1.45; overflow-x: auto; white-space: pre; color: var(--muted); }
    a { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <ol>
      <li><b data-t="s1"></b><p data-t="s1p"></p></li>
      <li>
        <b data-t="s2"></b><p data-t="s2p"></p>
        <button id="copy" type="button" data-t="copy"></button>
        <pre id="script"></pre>
      </li>
      <li><b data-t="s3"></b><p data-t="s3p"></p></li>
      <li><b data-t="s4"></b><p data-t="s4p"></p></li>
      <li><b data-t="s5"></b><p data-t="s5p"></p></li>
      <li><b data-t="s6"></b><p data-t="s6p"></p></li>
    </ol>

    <!-- Widgets cannot be ticked or typed into on iOS. A Shortcuts button on
         the home screen can, without opening anything: its questions pop up
         over the home screen and it runs FlowDesk's script in the
         background. -->
    <h2 data-t="actTitle"></h2>
    <p class="lead" data-t="actLead"></p>
    <div class="card"><b data-t="logTitle"></b><ol class="sub" id="logSteps"></ol></div>
    <div class="card"><b data-t="voiceTitle"></b><ol class="sub" id="voiceSteps"></ol></div>
    <div class="card"><b data-t="tickTitle"></b><ol class="sub" id="tickSteps"></ol></div>
    <div class="card"><b data-t="placeTitle"></b><ol class="sub" id="placeSteps"></ol></div>
  </main>
  <script>
    var pt = /^pt/i.test(navigator.language)
    var T = pt ? {
      title: 'FlowDesk no ecrã principal',
      lead: 'As tarefas de hoje num widget do iPhone, sempre atualizadas.',
      s1: 'Instale o Scriptable',
      s1p: 'É grátis, na App Store. É ele que mostra o widget.',
      s2: 'Copie o script',
      s2p: 'Abra esta página no iPhone e toque no botão.',
      copy: 'Copiar o script', copied: 'Copiado ✓',
      s3: 'Cole-o no Scriptable',
      s3p: 'Abra o Scriptable, toque em + no canto superior direito e cole. Toque no título “Untitled Script” e chame-lhe FlowDesk. Toque em Done.',
      s4: 'Corra-o uma vez e entre',
      s4p: 'Toque no script FlowDesk. Entre com o email e a palavra-passe do FlowDesk. Aparece uma pré-visualização.',
      s5: 'Adicione o widget',
      s5p: 'No ecrã principal, mantenha o dedo num espaço vazio → Editar → Adicionar widget → Scriptable → escolha o tamanho → Adicionar. Depois mantenha o dedo no widget → Editar widget → Script: FlowDesk.',
      s6: 'Escolha o que mostra',
      s6p: 'No FlowDesk: Definições → Widget. Escolha uma: tarefas de hoje, lista de tarefas, registo de trabalho ou notas. Para ter outra, adicione um segundo widget e escreva-a em Parameter ao editá-lo (tasks, todos, worklog ou notes).'
    } : {
      title: 'FlowDesk on your home screen',
      lead: 'Today’s tasks in an iPhone widget, kept up to date.',
      s1: 'Install Scriptable',
      s1p: 'Free, on the App Store. It is what shows the widget.',
      s2: 'Copy the script',
      s2p: 'Open this page on your iPhone and tap the button.',
      copy: 'Copy the script', copied: 'Copied ✓',
      s3: 'Paste it into Scriptable',
      s3p: 'Open Scriptable, tap + at the top right and paste. Tap the “Untitled Script” title and call it FlowDesk. Tap Done.',
      s4: 'Run it once and sign in',
      s4p: 'Tap the FlowDesk script. Sign in with your FlowDesk email and password. A preview appears.',
      s5: 'Add the widget',
      s5p: 'On your home screen, press and hold an empty spot → Edit → Add Widget → Scriptable → pick a size → Add Widget. Then press and hold the widget → Edit Widget → Script: FlowDesk.',
      s6: 'Choose what it shows',
      s6p: 'In FlowDesk: Settings → Widget. Pick one: today’s tasks, to-dos, work log or notes. For another, add a second widget and type it into Parameter when editing it (tasks, todos, worklog or notes).'
    }
    if (pt) document.documentElement.lang = 'pt'
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = T[el.getAttribute('data-t')] })

    // Steps carry <code> for what is typed exactly, so they go in as markup.
    var A = pt ? {
      actTitle: 'Marcar e registar sem abrir nada',
      actLead: 'Um widget do iPhone não deixa marcar nem escrever — a Apple não permite. Um botão dos Atalhos no ecrã principal deixa: as perguntas aparecem por cima do ecrã principal e nada se abre. Faça estes dois uma vez, na aplicação Atalhos.',
      logTitle: 'Botão “Registar trabalho”',
      log: [
        'Abra a aplicação <b>Atalhos</b> e toque em <b>+</b>.',
        'Procure <b>Pedir entrada</b> e toque nele. Em Pergunta escreva: <code>O que fez, e quanto tempo?</code>',
        'Procure <b>Run Script</b> (do Scriptable) e toque nele. Toque em <b>Script</b> → <b>FlowDesk</b>. Toque na seta → desligue <b>Run In App</b> e <b>Show When Run</b>. Deve ficar “Run FlowDesk with <b>Pedir entrada</b>”.',
        'Procure <b>Refresh All Widgets</b> e toque nele. Não há nada para preencher.',
        'Procure <b>Mostrar notificação</b> e toque nele. Toque no texto que lá está, apague-o, toque em <b>Selecionar variável</b> e toque no passo <b>Run FlowDesk</b> de cima.',
        'Toque no nome lá em cima e chame-lhe <code>Registar trabalho</code>.',
        'Ao usar, escreva o que fez e o tempo no fim: <code>Chamada com cliente 45</code> ou <code>Edição 1h30</code>. Para falar, toque no microfone do teclado.'
      ],
      voiceTitle: 'Botão “Registar por voz” — sem teclado',
      voice: [
        'Nos Atalhos, toque em <b>+</b>.',
        'Procure <b>Ditar texto</b> e toque nele. Idioma: <b>Português</b>. Parar de ouvir: <b>Após pausa</b>.',
        'Procure <b>Run Script</b> (do Scriptable) e toque nele. Toque em <b>Script</b> → <b>FlowDesk</b>. Toque na seta → desligue <b>Run In App</b> e <b>Show When Run</b>. Deve ficar “Run FlowDesk with <b>Ditar texto</b>”.',
        'Procure <b>Refresh All Widgets</b> e toque nele. Não há nada para preencher.',
        'Procure <b>Mostrar notificação</b> e toque nele. Toque no texto que lá está, apague-o, toque em <b>Selecionar variável</b> e toque no passo <b>Run FlowDesk</b> de cima.',
        'Chame-lhe <code>Registar por voz</code>.',
        'Ao usar: toque, diga por exemplo “Chamada com a Dinamene, vinte minutos” e pare de falar. Guarda-se sozinho.'
      ],
      tickTitle: 'Botão “Marcar tarefa”',
      tick: [
        'Nos Atalhos, toque em <b>+</b>.',
        'Procure <b>Run Script</b> (do Scriptable) e toque nele. Toque em <b>Script</b> → <b>FlowDesk</b>. Toque na seta → desligue <b>Run In App</b> e <b>Show When Run</b>. Deixe o “with” vazio — sem nada, o FlowDesk devolve as suas tarefas por fazer.',
        'Procure <b>Escolher da lista</b> e toque nele. Pergunta: <code>Qual está feita?</code>',
        'Procure <b>Run Script</b> (do Scriptable) e toque nele. Toque em <b>Script</b> → <b>FlowDesk</b>. Toque na seta → desligue <b>Run In App</b> e <b>Show When Run</b>. Deve ficar “Run FlowDesk with <b>Escolher da lista</b>”.',
        'Procure <b>Refresh All Widgets</b> e toque nele. Não há nada para preencher.',
        'Procure <b>Mostrar notificação</b> e toque nele. Toque no texto que lá está, apague-o, toque em <b>Selecionar variável</b> e toque no passo <b>Run FlowDesk</b> de cima.',
        'Chame-lhe <code>Marcar tarefa</code>.'
      ],
      placeTitle: 'Pô-los no ecrã principal',
      place: [
        'Mantenha o dedo num espaço vazio → <b>Editar</b> → <b>Adicionar widget</b> → <b>Atalhos</b>.',
        'O pequeno tem um botão; o médio tem quatro. Toque em <b>Adicionar widget</b>.',
        'Mantenha o dedo nele → <b>Editar widget</b> → escolha os atalhos.',
        'Também funcionam pela Siri: “Registar trabalho”.'
      ]
    } : {
      actTitle: 'Tick off and log without opening anything',
      actLead: 'An iPhone widget cannot be ticked or typed into — Apple does not allow it. A Shortcuts button on the home screen can: its questions pop up over the home screen and nothing opens. Make these two once, in the Shortcuts app.',
      logTitle: '“Log work” button',
      log: [
        'Open the <b>Shortcuts</b> app and tap <b>+</b>.',
        'Search <b>Ask for Input</b> and tap it. In Prompt write: <code>What did you do, and how long?</code>',
        'Search <b>Run Script</b> (Scriptable) and tap it. Tap <b>Script</b> → <b>FlowDesk</b>. Tap the arrow → turn off <b>Run In App</b> and <b>Show When Run</b>. It should read “Run FlowDesk with <b>Ask for Input</b>”.',
        'Search <b>Refresh All Widgets</b> and tap it. Nothing to fill in.',
        'Search <b>Show Notification</b> and tap it. Tap the text in it, delete it, tap <b>Select Variable</b>, then tap the <b>Run FlowDesk</b> step above.',
        'Tap the name at the top and call it <code>Log work</code>.',
        'When you use it, type what you did with the time at the end: <code>Client call 45</code> or <code>Editing 1h30</code>. To speak, tap the mic on the keyboard.'
      ],
      voiceTitle: '“Log by voice” button — no keyboard',
      voice: [
        'In Shortcuts, tap <b>+</b>.',
        'Search <b>Dictate Text</b> and tap it. Language: <b>English</b> (or Portuguese). Stop Listening: <b>After Pause</b>.',
        'Search <b>Run Script</b> (Scriptable) and tap it. Tap <b>Script</b> → <b>FlowDesk</b>. Tap the arrow → turn off <b>Run In App</b> and <b>Show When Run</b>. It should read “Run FlowDesk with <b>Dictate Text</b>”.',
        'Search <b>Refresh All Widgets</b> and tap it. Nothing to fill in.',
        'Search <b>Show Notification</b> and tap it. Tap the text in it, delete it, tap <b>Select Variable</b>, then tap the <b>Run FlowDesk</b> step above.',
        'Call it <code>Log by voice</code>.',
        'To use it: tap, say something like “Call with Dinamene, twenty minutes”, and stop talking. It saves itself.'
      ],
      tickTitle: '“Tick off” button',
      tick: [
        'In Shortcuts, tap <b>+</b>.',
        'Search <b>Run Script</b> (Scriptable) and tap it. Tap <b>Script</b> → <b>FlowDesk</b>. Tap the arrow → turn off <b>Run In App</b> and <b>Show When Run</b>. Leave “with” empty — given nothing, FlowDesk hands back your open to-dos.',
        'Search <b>Choose from List</b> and tap it. Prompt: <code>Which one is done?</code>',
        'Search <b>Run Script</b> (Scriptable) and tap it. Tap <b>Script</b> → <b>FlowDesk</b>. Tap the arrow → turn off <b>Run In App</b> and <b>Show When Run</b>. It should read “Run FlowDesk with <b>Choose from List</b>”.',
        'Search <b>Refresh All Widgets</b> and tap it. Nothing to fill in.',
        'Search <b>Show Notification</b> and tap it. Tap the text in it, delete it, tap <b>Select Variable</b>, then tap the <b>Run FlowDesk</b> step above.',
        'Call it <code>Tick off</code>.'
      ],
      placeTitle: 'Put them on your home screen',
      place: [
        'Press and hold an empty spot → <b>Edit</b> → <b>Add Widget</b> → <b>Shortcuts</b>.',
        'The small one is one button; the medium one holds four. Tap <b>Add Widget</b>.',
        'Press and hold it → <b>Edit Widget</b> → pick the shortcuts.',
        'They work with Siri too: “Log work”.'
      ]
    }
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var k = el.getAttribute('data-t')
      if (A[k]) el.textContent = A[k]
    })
    function steps(id, list) {
      document.getElementById(id).innerHTML = list.map(function (x) { return '<li>' + x + '</li>' }).join('')
    }
    steps('logSteps', A.log)
    steps('voiceSteps', A.voice)
    steps('tickSteps', A.tick)
    steps('placeSteps', A.place)

    // The loader. Kept tiny on purpose: everything else is downloaded from
    // FlowDesk each time the widget refreshes, so it never needs pasting again.
    var script = [
      '// FlowDesk: today’s tasks on your home screen.',
      '// Leave this as it is. The widget itself is downloaded from FlowDesk',
      '// each time it refreshes, so it keeps itself up to date.',
      "const APP = '" + location.origin + "'",
      'const fm = FileManager.local()',
      "const file = fm.joinPath(fm.libraryDirectory(), 'flowdesk-widget.js')",
      'try {',
      "  const code = await new Request(APP + '/widget/flowdesk-widget.js').loadString()",
      "  if (code.includes('flowdesk.widget.session')) fm.writeString(file, code)",
      '} catch (e) {}',
      "if (!fm.fileExists(file)) throw new Error('Could not reach FlowDesk. Check the connection and try again.')",
      'await importModule(file)(APP)',
      ''
    ].join('\n')
    document.getElementById('script').textContent = script

    var btn = document.getElementById('copy')
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = T.copied; btn.className = 'done' }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(script).then(done, fallback)
      } else fallback()
      function fallback() {
        var area = document.createElement('textarea')
        area.value = script
        document.body.appendChild(area)
        area.select()
        document.execCommand('copy')
        document.body.removeChild(area)
        done()
      }
    })
  </script>
</body>
</html>
