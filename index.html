<!doctype html>
<!-- translate="no": FlowDesk translates itself (English / Português). A
     browser translating it as well rewrites text React is still holding on
     to, and from then on buttons and lists stop updating or crash outright -
     on that one phone only, which is what makes it so hard to place. -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Phones: the page is always exactly the width of the screen, with no
         pinch or double-tap zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // iOS Safari ignores user-scalable=no, so its pinch gesture is stopped here.
      document.addEventListener('gesturestart', function (e) { e.preventDefault() }, { passive: false })
    </script>
    <!-- Phones: installable to the home screen, which is what makes push
         notifications possible on iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1A5C3A" />
    <meta name="google" content="notranslate" />
    <!-- FlowDesk has no dark theme. Without this, Samsung Internet and Chrome
         on a phone in dark mode invert the page themselves, which leaves dark
         text on dark fills and the person colours unreadable. -->
    <meta name="color-scheme" content="only light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FlowDesk" />
    <title>FlowDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
